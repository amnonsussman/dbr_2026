<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ד.ב.ר — שיבוץ לנבחרות</title>
  <style>
    :root{
      --bg:#f4f2ec;--ink:#18212f;--muted:#5f6673;--line:#ddd4c4;
      --blue:#1f5f8b;--blue-dark:#174867;--green:#28745f;--green-dark:#1e5949;
      --amber:#b6781f;--soft-blue:#e8f1f7;--soft-green:#e8f4ef;--soft-amber:#fbf0dc;
      --shadow:0 18px 45px rgba(28,36,50,.12);--radius:22px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI",Arial,sans-serif;
      background:radial-gradient(circle at top right,rgba(31,95,139,.14),transparent 28%),
        radial-gradient(circle at bottom left,rgba(40,116,95,.12),transparent 30%),var(--bg);
      color:var(--ink);line-height:1.75}
    #loading{text-align:center;padding:80px 20px;color:var(--muted);font-size:1.2rem}
    .page{width:min(1120px,calc(100% - 32px));margin:32px auto 64px}
    /* ── Hero ── */
    .hero{background:linear-gradient(135deg,#1b3d54,var(--blue-dark) 55%,#1b4433 100%);
      color:white;border-radius:var(--radius);padding:40px 44px 34px;
      box-shadow:0 24px 52px rgba(23,72,103,.3);margin-bottom:26px;position:relative;overflow:hidden}
    .hero::before{content:"";position:absolute;inset-inline-end:-80px;top:-90px;
      width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
    .hero-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;position:relative}
    .brand-mark{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);
      display:grid;place-items:center;font-weight:900;font-size:.95rem}
    .stage-badge{background:rgba(255,255,255,.18);border-radius:999px;
      padding:6px 14px;font-size:.9rem;border:1px solid rgba(255,255,255,.25)}
    .hero h1{margin:0 0 14px;font-size:clamp(1.7rem,4vw,3rem);font-weight:900;position:relative}
    .hero-stats{display:flex;gap:14px;flex-wrap:wrap;position:relative}
    .hero-stat{background:rgba(255,255,255,.15);border-radius:16px;padding:14px 18px;min-width:120px;
      border:1px solid rgba(255,255,255,.2)}
    .hero-stat strong{display:block;font-size:1.55rem;font-weight:900;line-height:1}
    .hero-stat span{display:block;font-size:.88rem;opacity:.82;margin-top:5px}
    /* ── Grid of score cards ── */
    .cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:26px}
    .score-card{background:white;border:1px solid var(--line);border-radius:22px;
      padding:22px;box-shadow:0 8px 24px rgba(28,36,50,.07);
      display:flex;flex-direction:column;gap:12px}
    .score-badge{display:inline-flex;width:fit-content;padding:7px 13px;border-radius:999px;
      font-weight:800;font-size:.88rem;background:#f0ebe2;color:#4a4035}
    .score-badge.high{background:rgba(40,116,95,.14);color:var(--green-dark)}
    .score-badge.mid{background:rgba(182,120,31,.14);color:#6a4717}
    .score-title{font-size:1.2rem;font-weight:800;color:var(--ink);margin-bottom:4px}
    .score-note{font-size:.92rem;color:var(--muted);line-height:1.55}
    .meter{height:8px;background:#e8e2d8;border-radius:999px;margin-top:6px;overflow:hidden}
    .fill{height:100%;border-radius:999px;background:#c5bab0}
    .fill.high{background:var(--green)}
    .fill.mid{background:var(--amber)}
    /* ── Summary ── */
    .summary-section{background:white;border:1px solid var(--line);border-radius:var(--radius);
      padding:32px;box-shadow:0 14px 32px rgba(28,36,50,.07);margin-bottom:22px}
    .summary-section h2{margin:0 0 16px;font-size:1.7rem;color:var(--blue-dark)}
    .summary-section p{margin:0 0 14px;color:#2d3a46}
    .summary-boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
    .summary-box{border-radius:18px;padding:20px;border:1px solid var(--line);background:var(--bg)}
    .summary-box:nth-child(1){background:var(--soft-green);border-color:rgba(40,116,95,.2)}
    .summary-box:nth-child(2){background:var(--soft-amber);border-color:rgba(182,120,31,.22)}
    .summary-box:nth-child(3){background:var(--soft-blue);border-color:rgba(31,95,139,.18)}
    .summary-box strong{display:block;font-size:1.05rem;margin-bottom:8px;color:var(--ink)}
    .summary-box:nth-child(1) strong{color:var(--green-dark)}
    .summary-box:nth-child(2) strong{color:#6a4717}
    .summary-box:nth-child(3) strong{color:var(--blue-dark)}
    /* ── Bottom line ── */
    .bottom-line{background:linear-gradient(135deg,rgba(31,95,139,.1),rgba(40,116,95,.1)),white;
      border:1px solid rgba(31,95,139,.18);border-radius:var(--radius);padding:28px 32px;
      margin-bottom:22px;box-shadow:0 14px 32px rgba(28,36,50,.06)}
    .bottom-line h2{margin:0 0 12px;font-size:1.55rem;color:var(--blue-dark)}
    .bottom-line p{margin:0;color:#2d3a46}
    .op-line{background:var(--soft-amber);border:1px solid rgba(182,120,31,.22);
      border-radius:18px;padding:18px 22px;margin-bottom:22px;color:#4b3a20}
    /* ── Nav row ── */
    .nav-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
    a.btn{display:inline-flex;align-items:center;padding:11px 20px;border-radius:14px;
      color:white;background:var(--blue);text-decoration:none;font-weight:700}
    a.btn.green{background:var(--green)}
    a.btn.ghost{background:white;color:var(--blue-dark);border:1px solid rgba(31,95,139,.25);
      box-shadow:none}
    .footer{margin-top:24px;padding:18px 22px;color:var(--muted);text-align:center;
      font-size:.9rem;background:white;border-radius:16px;border:1px solid var(--line)}
    @media(max-width:860px){
      .hero{padding:28px 24px 22px}
      .cards-grid{grid-template-columns:1fr 1fr}
      .summary-boxes{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .cards-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div id="loading" class="page">טוען דף שיבוץ לנבחרות...</div>
<script>
(async () => {
  const raw  = location.search.slice(1);
  const code = raw.replace(/\d+$/, '').toUpperCase();
  if (!code) { document.getElementById('loading').textContent = 'קוד מועמד חסר בכתובת'; return; }

  let d;
  try {
    const res = await fetch(`candidates/${code}.json`);
    if (!res.ok) throw new Error(`${code}.json — ${res.status}`);
    d = await res.json();
  } catch(e) {
    document.getElementById('loading').textContent = 'שגיאה בטעינה: ' + e.message;
    return;
  }

  const prefix    = raw.replace(/\d+$/, '');
  const introUrl  = `100.html?${prefix}${d.page_codes.intro}`;
  const dossierUrl= `101.html?${prefix}${d.page_codes.dossier}`;

  document.title = `ד.ב.ר — סיווג סופי לנבחרות | ${d.name}`;

  const heroStats = (d.hero_stats || []).map(s =>
    `<div class="hero-stat"><strong>${s.label}</strong><span>${s.sub}</span></div>`
  ).join('');

  const scoreCards = (d.score_cards || []).map(c => {
    const bc = c.badge_class ? ` ${c.badge_class}` : '';
    const fc = c.meter_class ? ` ${c.meter_class}` : '';
    return `<article class="score-card">
      <div class="score-badge${bc}">${c.badge_text}</div>
      <div>
        <div class="score-title">${c.title}</div>
        <div class="score-note">${c.note}</div>
        <div class="meter"><div class="fill${fc}" style="width:${c.meter_pct}%"></div></div>
      </div>
    </article>`;
  }).join('\n');

  const summaryBoxes = (d.summary_boxes || []).map(b =>
    `<div class="summary-box"><strong>${b.title}</strong>${b.text}</div>`
  ).join('');

  document.getElementById('loading').outerHTML = `
<main class="page">
  <div class="nav-row">
    <a class="btn ghost" href="${introUrl}">חזרה לדף עיון</a>
    <a class="btn" href="${dossierUrl}">לתיק העובדתי</a>
  </div>

  <header class="hero">
    <div class="hero-top">
      <div class="brand-mark">ד.ב.ר</div>
      <span class="stage-badge">סיווג סופי לנבחרות</span>
    </div>
    <h1>${d.name} — שיבוץ לנבחרות</h1>
    <div class="hero-stats">${heroStats}</div>
  </header>

  <div class="cards-grid">${scoreCards}</div>

  <section class="summary-section">
    <h2>סיכום תמציתי</h2>
    <p>${d.summary_paragraph}</p>
    <div class="summary-boxes">${summaryBoxes}</div>
  </section>

  <div class="bottom-line">
    <h2>שורה תחתונה</h2>
    <p>${d.bottom_line}</p>
  </div>

  <div class="op-line"><strong>הערת המנתח:</strong> ${d.op_line}</div>

  <footer class="footer">
    ד.ב.ר — דמוקרטים בוחרים רציונלית · סיווג סופי לנבחרות ·
    תאריך עיבוד: ${d.render_date}
  </footer>
</main>`;
})();
</script>
</body>
</html>
