<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ד.ב.ר — טוען...</title>
  <style>
    :root {
      --bg:#f4f2ec; --ink:#18212f; --muted:#5f6673; --line:#ddd4c4;
      --blue:#1f5f8b; --blue-dark:#174867; --green:#28745f; --green-dark:#1e5949;
      --amber:#b6781f; --soft-blue:#e8f1f7; --soft-green:#e8f4ef; --soft-amber:#fbf0dc;
      --shadow:0 18px 45px rgba(28,36,50,.12); --radius:22px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI",Arial,sans-serif;
      background:radial-gradient(circle at top right,rgba(31,95,139,.16),transparent 30%),
        radial-gradient(circle at bottom left,rgba(182,120,31,.13),transparent 32%),var(--bg);
      color:var(--ink);line-height:1.75}
    .page{width:min(1120px,calc(100% - 32px));margin:32px auto 48px}
    #loading{text-align:center;padding:80px 20px;color:var(--muted);font-size:1.2rem}
    .hero{background:linear-gradient(135deg,#fffaf1 0%,#f7efe0 52%,#e7f0f6 100%);
      border:1px solid rgba(31,95,139,.18);border-radius:30px;box-shadow:var(--shadow);
      overflow:hidden;position:relative}
    .hero::before{content:"";position:absolute;inset-inline-start:-80px;top:-120px;
      width:260px;height:260px;background:rgba(40,116,95,.12);border-radius:50%}
    .hero-inner{position:relative;padding:46px 46px 38px}
    .brand-row{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-bottom:22px}
    .brand{display:inline-flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.02em;color:var(--blue-dark)}
    .brand-mark{width:48px;height:48px;border-radius:16px;background:var(--blue);color:white;
      display:grid;place-items:center;font-weight:900;box-shadow:0 10px 22px rgba(31,95,139,.25)}
    .stage-badge{background:rgba(255,255,255,.72);border:1px solid rgba(31,95,139,.18);color:var(--muted);
      border-radius:999px;padding:8px 16px;font-size:.95rem;white-space:nowrap}
    h1{margin:0;font-size:clamp(2rem,5vw,4.3rem);line-height:1.12;color:var(--ink);letter-spacing:-.04em}
    .subtitle{max-width:870px;margin:18px 0 0;font-size:clamp(1.05rem,2.3vw,1.35rem);color:#354152}
    .candidate-strip{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;
      margin-top:32px;padding:22px 24px;background:rgba(255,255,255,.68);
      border:1px solid rgba(221,212,196,.9);border-radius:22px}
    .candidate-strip h2{margin:0 0 4px;font-size:1.55rem}
    .candidate-strip p{margin:0;color:var(--muted)}
    .score-mini{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;justify-content:flex-end}
    .mini-card{min-width:105px;padding:12px 14px;background:white;border:1px solid var(--line);border-radius:16px;text-align:center}
    .mini-card strong{display:block;font-size:.98rem;color:var(--blue-dark);line-height:1.25}
    .mini-card span{display:block;color:var(--muted);font-size:.86rem;margin-top:5px}
    .section{margin-top:26px;background:rgba(255,250,241,.9);border:1px solid var(--line);
      border-radius:var(--radius);box-shadow:0 14px 32px rgba(28,36,50,.07);padding:30px}
    .section h2{margin:0 0 12px;font-size:1.65rem;color:var(--blue-dark)}
    .section p{margin:0 0 14px;color:#333c4b}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
    .info-card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px}
    .info-card .num{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
      font-weight:800;color:white;background:var(--blue);margin-bottom:12px}
    .info-card:nth-child(2) .num{background:var(--green)}
    .info-card:nth-child(3) .num{background:var(--amber)}
    .info-card h3{margin:0 0 8px;font-size:1.15rem}
    .info-card p{margin:0;color:var(--muted);font-size:.97rem}
    .two-docs{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:20px}
    .doc-card{position:relative;overflow:hidden;background:white;border:1px solid var(--line);
      border-radius:22px;padding:26px;min-height:318px;display:flex;flex-direction:column;justify-content:space-between}
    .doc-card::after{content:"";position:absolute;inset-inline-start:-35px;bottom:-45px;
      width:135px;height:135px;border-radius:50%;background:rgba(31,95,139,.09)}
    .doc-card.green::after{background:rgba(40,116,95,.11)}
    .doc-type{display:inline-flex;width:fit-content;border-radius:999px;padding:7px 13px;
      font-size:.88rem;font-weight:700;color:var(--blue-dark);background:var(--soft-blue);margin-bottom:16px}
    .doc-card.green .doc-type{color:var(--green-dark);background:var(--soft-green)}
    .doc-card h3{margin:0 0 10px;font-size:1.45rem;color:var(--ink)}
    .doc-card p{margin:0 0 14px;color:var(--muted)}
    .doc-card ul{margin:14px 0 22px;padding-inline-start:22px;color:#3d4654}
    .doc-card li{margin-bottom:7px}
    .app-card{margin-top:22px;padding:26px;border-radius:22px;
      background:linear-gradient(135deg,rgba(31,95,139,.12),rgba(182,120,31,.13)),#fffdf8;
      border:1px solid rgba(31,95,139,.18);box-shadow:0 16px 34px rgba(28,36,50,.08);
      display:grid;grid-template-columns:1.4fr .8fr;gap:22px;align-items:center}
    .app-card h3{margin:8px 0 10px;font-size:1.55rem;color:var(--blue-dark)}
    .app-card p{margin:0 0 12px;color:#3d4654}
    .status-pill{display:inline-flex;align-items:center;width:fit-content;padding:7px 12px;
      border-radius:999px;background:var(--soft-amber);color:#6a4717;
      border:1px solid rgba(182,120,31,.24);font-weight:800;font-size:.9rem}
    a.app-button{display:inline-flex;align-items:center;justify-content:center;text-align:center;
      min-height:58px;padding:16px 24px;border-radius:18px;color:#fff;
      background:linear-gradient(135deg,var(--amber),#d08b27);text-decoration:none;
      font-weight:900;font-size:1.08rem;box-shadow:0 14px 28px rgba(182,120,31,.28)}
    .button-row{display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:2}
    a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;
      padding:12px 20px;border-radius:14px;color:#fff;text-decoration:none;font-weight:800;
      background:var(--blue);box-shadow:0 10px 22px rgba(31,95,139,.2)}
    .green a.btn{background:var(--green)}
    a.secondary{display:inline-flex;align-items:center;color:var(--muted);text-decoration:none;font-weight:700;padding:12px 6px}
    .compare-table{width:100%;border-collapse:collapse;margin-top:16px;overflow:hidden;
      border-radius:16px;background:white;border:1px solid var(--line)}
    .compare-table th,.compare-table td{padding:15px 16px;text-align:right;
      border-bottom:1px solid var(--line);vertical-align:top}
    .compare-table th{background:#f3eadb;color:var(--blue-dark);font-weight:800}
    .compare-table tr:last-child td{border-bottom:none}
    .note{margin-top:20px;padding:18px 20px;border-radius:18px;background:var(--soft-amber);
      border:1px solid rgba(182,120,31,.22);color:#4b3a20}
    .footer{margin-top:24px;padding:22px 28px;color:var(--muted);text-align:center;font-size:.95rem}
    @media(max-width:860px){
      .hero-inner{padding:32px 24px}
      .candidate-strip{grid-template-columns:1fr}
      .score-mini{justify-content:stretch}
      .mini-card{flex:1 1 120px}
      .grid-3,.two-docs,.app-card{grid-template-columns:1fr}
      .section{padding:24px}
    }
    @media print{body{background:white}.page{width:100%;margin:0}a.btn,a.secondary,a.app-button{color:var(--ink);box-shadow:none;border:1px solid var(--line);background:white!important}}
  </style>
</head>
<body>
<div id="loading" class="page">טוען נתוני מועמד...</div>
<script>
(async () => {
  const raw  = location.search.slice(1);             // e.g. "gk970"
  const code = raw.replace(/\d+$/, '').toUpperCase(); // "GK"
  if (!code) { document.getElementById('loading').textContent = 'קוד מועמד חסר בכתובת'; return; }

  let d;
  try {
    const res = await fetch(`candidates/${code}.json`);
    if (!res.ok) throw new Error(res.status);
    d = await res.json();
  } catch(e) {
    document.getElementById('loading').textContent = `שגיאה בטעינת ${code}.json — ${e.message}`;
    return;
  }

  const prefix     = raw.replace(/\d+$/, '');          // "gk"
  const dossierUrl = `101.html?${prefix}${d.page_codes.dossier}`;
  const scoresUrl  = `102.html?${prefix}${d.page_codes.scores}`;

  const miniCards = d.mini_cards.map(c =>
    `<div class="mini-card"><strong>${c.label}</strong><span>${c.sub}</span></div>`
  ).join('\n');

  document.title = `ד.ב.ר — עיון, תיקון ומסמכי ${d.name}`;
  document.getElementById('loading').outerHTML = `
<main class="page">
  <section class="hero">
    <div class="hero-inner">
      <div class="brand-row">
        <div class="brand">
          <div class="brand-mark">ד.ב.ר</div>
          <div><div>דמוקרטים בוחרים רציונלית</div><small>מערכת תומכת החלטה לפריימריז</small></div>
        </div>
        <div class="stage-badge">דף עיון, תיקון וניווט למועמד/ת</div>
      </div>
      <h1>${d.name} — מסמכי עיון לפני פרסום</h1>
      <p class="subtitle">דף זה נשלח למועמד לעיון לפני פרסום ציבורי. הוא מרכז את ההסבר על מיזם ד.ב.ר, מאפשר כניסה ליישום לצורך הבנת סביבת הבחירה, ומפנה לשני מסמכים נפרדים: התיק העובדתי שעליו נשען הניתוח, ודף השיבוץ לנבחרות.</p>
      <div class="candidate-strip">
        <div>
          <h2>מה מוצג כאן?</h2>
          <p>לא מדובר באישור מועמד, בהמלצה אישית או בפסק דין על התאמה כללית. זהו מסלול עיון: הצגת בסיס המידע, הצגת הסיווג שנגזר ממנו, ומתן אפשרות לתיקון עובדתי, להשלמת מקורות או לבקשת אי־הכללה לפני פרסום.</p>
        </div>
        <div class="score-mini">${miniCards}</div>
      </div>
    </div>
  </section>

  <section class="section">
    <h2>מהו מיזם ד.ב.ר?</h2>
    <p>ד.ב.ר — דמוקרטים בוחרים רציונלית — הוא מיזם עצמאי של החתום מטה לבניית יישום תומך החלטה מבוסס בינות מלאכותיות. במקום להסתפק ברשימת שמות, המיזם מציג תמונת התאמה לפי תחומי פעולה ציבוריים: דמוקרטיה, יוקר מחיה, שלום וביטחון, שותפות יהודית־ערבית, דת ומדינה, הנהגה ציבורית, ועוד.</p>
    <p>המטרה אינה להחליף את שיקול הדעת של הבוחר, אינה לקבוע מי "ראוי" באופן מוחלט. ההערכות מבטאות רק את עוצמת העוגן העובדתי שנמצא לשיבוץ בכל נבחרת נושאית, על בסיס החומר שנבדק.</p>
    <p>לפני פרסום ציבורי, החומרים נשלחים למועמד/ת לעיון. ניתן להעיר על טעות עובדתית, להציע מקור משלים, לבקש תיקון ניסוח, או לבקש שלא להיכלל בפרסום הציבורי. אי־תגובה אינה נחשבת לאישור.</p>
    <p style="margin:0">בברכה ובהצלחה,<br><strong>אמנון זוסמן</strong> · <a href="tel:0523968917" dir="ltr" style="unicode-bidi:isolate;color:var(--blue-dark);font-weight:700;text-decoration:none">052-3968917</a></p>
    <hr style="border:none;border-top:1px solid var(--line);margin:18px 0">
    <div class="note"><strong>מסגרת הזמן לעיון ולתגובה:</strong> מועדי הפריימריז טרם נקבעו סופית. ניתן להגיש פנייה לתיקון עובדתי, להשלמת מקורות או לבקשת אי־הכללה <strong>בכל עת, ולא יאוחר מ־14 יום לפני מועד הפריימריז שייקבע</strong>.</div>
    <div class="grid-3">
      <article class="info-card"><div class="num">1</div><h3>איסוף עובדתי</h3><p>נבנה תיק עובדתי על פעילות, תפקידים, עמדות וסיגנלים ציבוריים, תוך הפרדה בין עובדות להערכות.</p></article>
      <article class="info-card"><div class="num">2</div><h3>סיווג לנבחרות</h3><p>כל מועמד/ת נבחן/ת מול נבחרות נושאיות, וההערכה משקפת את חוזק העוגן בתחום.</p></article>
      <article class="info-card"><div class="num">3</div><h3>עיון ותיקון</h3><p>לפני פרסום, המועמד/ת יכול/ה להעביר תיקונים, מקורות משלימים או בקשת אי־הכללה.</p></article>
    </div>
    <div class="app-card">
      <div>
        <span class="status-pill" style="background:var(--soft-blue);color:var(--blue-dark);border-color:rgba(31,95,139,.24)">מתודולוגיה</span>
        <h3>מיזם המבוסס על ארבע בינות מלאכותיות</h3>
        <p>כדי להפחית הטיה של מודל יחיד ולהצליב מידע, כל שלב במיזם נשען על בינה מלאכותית אחרת.</p>
        <div class="grid-3" style="margin-top:6px">
          <article class="info-card"><div class="num">1</div><h3>פֵּרְפלקסיטי</h3><p>איסוף המידע העובדתי מהמקורות הציבוריים ובניית התיק העובדתי.</p></article>
          <article class="info-card"><div class="num">2</div><h3>ג'י־פי־טי</h3><p>עיבוד וניתוח החומר והפיכתו למבנה מסודר לקראת הסיווג.</p></article>
          <article class="info-card"><div class="num">3</div><h3>ג'מיני</h3><p>הצלבה ובקרה נוספת על הניתוח ועל ההערכות שנגזרו ממנו.</p></article>
        </div>
        <p style="margin-top:14px"><strong>קלוד (Claude)</strong> משמש כ<strong>ראש הצוות והמתכנת הראשי</strong> של המיזם — אחראי על האינטגרציה בין השלבים, על פיתוח הקוד ועל הבקרה הכוללת.</p>
      </div>
    </div>
    <div class="note"><strong>מסלול העיון לפני פרסום:</strong> החומר נשלח למועמד/ת כדי לאפשר בדיקה הוגנת לפני חשיפה ציבורית. גם לאחר פרסום, תיקון עובדתי מבוסס מקור יוכל להיבחן ולעדכן את המסמכים.</div>
    <div class="app-card">
      <div>
        <span class="status-pill">היישום עדיין מתעדכן</span>
        <h3>כניסה ליישום ד.ב.ר</h3>
        <p>לצורך הבנת המערכת המלאה, ניתן להיכנס ליישום עצמו ולראות את סביבת הבחירה, המסכים והאופן שבו נבחרות ומועמדים מוצגים לבוחר.</p>
      </div>
      <div class="button-row">
        <a class="app-button" href="https://amnonsussman.github.io/dbr_2026/dbr_P_01_index.html" target="_blank" rel="noopener">כניסה ליישום</a>
      </div>
    </div>
  </section>

  <section class="section">
    <h2>שני המסמכים</h2>
    <p>ההצגה מחולקת לשני דפים נפרדים: הראשון מציג את בסיס העובדות, והשני מציג את תוצאת הסיווג לנבחרות.</p>
    <div class="two-docs">
      <article class="doc-card">
        <div>
          <span class="doc-type">מסמך בסיס</span>
          <h3>התיק העובדתי — שלב שני</h3>
          <p>תפקידים, ניסיון, עמדות מוצהרות, תחומים שבהם אין מידע מספיק, טענות שדורשות בדיקה ומגבלות התיק.</p>
          <ul>
            <li>מיועד לבדוק את בסיס העובדות.</li>
            <li>אינו מדרג ואינו משבץ לנבחרות.</li>
            <li>מאפשר לזהות מידע חסר או טענה שצריך לתקן.</li>
          </ul>
        </div>
        <div class="button-row">
          <a class="btn" href="${dossierUrl}">לפתיחת התיק העובדתי</a>
          <a class="secondary" href="${dossierUrl}" target="_blank" rel="noopener">פתח בלשונית חדשה</a>
        </div>
      </article>
      <article class="doc-card green">
        <div>
          <span class="doc-type">תוצאת סיווג</span>
          <h3>דף השיבוץ לנבחרות</h3>
          <p>ההערכות הסופיות של ${d.name} בכל נבחרת, ואת ההסבר התמציתי למשמעות השיבוץ.</p>
          <ul>
            <li>מציג את דירוג ההתאמה לנבחרות.</li>
            <li>מפריד בין תחומי ליבה, התאמה חלקית והיעדר עוגן מספיק.</li>
            <li>משמש להשוואה מול כלל המועמדים.</li>
          </ul>
        </div>
        <div class="button-row">
          <a class="btn" href="${scoresUrl}">לפתיחת דף השיבוץ</a>
          <a class="secondary" href="${scoresUrl}" target="_blank" rel="noopener">פתח בלשונית חדשה</a>
        </div>
      </article>
    </div>
  </section>

  <section class="section">
    <h2>מה ההבדל בין שני הדפים?</h2>
    <table class="compare-table">
      <thead><tr><th>שאלה</th><th>התיק העובדתי</th><th>דף השיבוץ</th></tr></thead>
      <tbody>
        <tr><td>מה הוא מציג?</td><td>את בסיס המידע: תפקידים, פעילות, עמדות, מגבלות ומידע חסר.</td><td>את ההערכות הסופיות של המועמד בכל נבחרת נושאית.</td></tr>
        <tr><td>למה הוא מיועד?</td><td>לבדיקת העובדות שעליהן נשען הסיווג.</td><td>להבנת המיקום של המועמד בתוך הנבחרות.</td></tr>
        <tr><td>מה אפשר לערער?</td><td>עובדות חסרות, עובדות שגויות, טענות שדורשות תיקון.</td><td>את פרשנות השיבוץ, בעיקר כאשר מוצג מידע עובדתי נוסף.</td></tr>
      </tbody>
    </table>
    <div class="note"><strong>הערה חשובה:</strong> הערכה נמוכה אינה קובעת שהמועמד מתנגד לנושא. המשמעות היא שבחומר שנבדק לא נמצא עוגן עובדתי מספיק לשיבוץ גבוה באותה נבחרת.</div>
  </section>

  <footer class="footer">ד.ב.ר — דמוקרטים בוחרים רציונלית · דף עיון ותיקון למועמד/ת לפני פרסום · יוני 2026</footer>
</main>`;
})();
</script>
</body>
</html>
